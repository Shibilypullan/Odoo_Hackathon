
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Product - Brightloop</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
        }

        h1 {
            color: #dc3545;
        }

        button {
            background: #dc3545;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        a {
            margin-left: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Delete Product</h1>

    <p>
        Are you sure you want to delete
        <strong>{{ product.name }}</strong>?
    </p>

    <form method="POST">
        {% csrf_token %}

        <button type="submit">Yes, Delete</button>

        <a href="{% url 'products:product_list' %}">
            Cancel
        </a>
    </form>

</div>

</body>
</html>
